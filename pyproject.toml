[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podsummary"
version = "0.1.0"
description = "Summarise Spotify podcasts by matching them to YouTube videos and summarising YouTube transcripts with OpenAI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ben Forrest" }]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "openai>=1.0",
    "youtube-transcript-api>=0.6",
]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2023.7.6"]
dev = ["pytest>=7.0"]

[project.scripts]
podsummary = "podsummary.cli:main"

[tool.setuptools.packages.find]
include = ["podsummary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
